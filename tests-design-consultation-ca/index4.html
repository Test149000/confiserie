<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI CA Ultra-Compact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .progress-bar-transition {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-full bg-slate-950 text-slate-100 font-sans p-3 sm:p-6 flex flex-col justify-center items-center">

    <div class="w-full max-w-sm sm:max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-3.5 sm:p-4 shadow-xl relative overflow-hidden">
        
        <!-- En-tête : Titre, Bouton Édition & Badge d'Évolution -->
        <div class="flex items-center justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">CA Année N</span>
                <button onclick="toggleEditModal()" class="p-1 text-slate-500 hover:text-slate-300 transition-colors rounded-md" title="Modifier les données">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Badge de variation vs N-1 à date -->
            <div id="badge-variation" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                <i id="badge-icon" data-lucide="trending-up" class="w-3 h-3"></i>
                <span id="badge-text">+9.8%</span>
            </div>
        </div>

        <!-- Chiffre Principal (CA N) + Delta Absolu -->
        <div class="flex items-baseline justify-between mb-2">
            <span id="display-ca-n" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
                450 000 €
            </span>
            <span id="display-delta-abs" class="text-xs font-semibold text-emerald-400">
                +40 000 € vs N-1 à date
            </span>
        </div>

        <!-- Zone de la Barre de Progression -->
        <div class="relative mb-2.5 pt-5">

            <!-- Repère N-1 à date -->
            <div id="marker-n1-date" class="absolute top-0 transform -translate-x-1/2 z-20 flex flex-col items-center progress-bar-transition" style="left: 68.33%;">
                <span id="marker-date-label" class="text-[9px] font-bold text-amber-400 bg-slate-950 px-1 rounded border border-amber-500/30 whitespace-nowrap mb-0.5">
                    N-1 date: 410k€
                </span>
                <div class="w-0.5 h-3.5 bg-amber-400"></div>
            </div>

            <!-- Repère N-1 Total (S'affiche uniquement en cas de dépassement > 100%) -->
            <div id="marker-n1-total" class="absolute top-0 transform -translate-x-1/2 z-20 flex flex-col items-center progress-bar-transition hidden">
                <span id="marker-total-label" class="text-[9px] font-bold text-slate-300 bg-slate-950 px-1 rounded border border-slate-700 whitespace-nowrap mb-0.5">
                    100% (600k€)
                </span>
                <div class="w-0.5 h-3.5 bg-slate-200 shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
            </div>

            <!-- Conteneur de la barre -->
            <div class="w-full h-3 bg-slate-800/90 rounded-full overflow-hidden relative border border-slate-800">
                <!-- Portion standard (jusqu'à 100% N-1 Total) -->
                <div id="bar-fill-base" class="h-full bg-blue-500 rounded-l-full progress-bar-transition float-left" style="width: 75%;"></div>
                <!-- Portion dépassement (au-delà de 100%) -->
                <div id="bar-fill-overflow" class="h-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.8)] progress-bar-transition float-left hidden" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Pied de carte ultra-condensé -->
        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80 text-xs">
            <div class="flex flex-col">
                <span class="text-[11px] text-slate-400">N-1 à même date</span>
                <span id="display-n1-date" class="font-semibold text-slate-200">410 000 €</span>
            </div>
            <div class="flex flex-col text-right">
                <div class="flex items-center justify-end gap-1">
                    <span class="text-[11px] text-slate-400">N-1 Total</span>
                    <span id="display-pct-badge" class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">75%</span>
                </div>
                <span id="display-n1-total" class="font-semibold text-slate-200">600 000 €</span>
            </div>
        </div>

    </div>

    <!-- Modal d'édition & Scénarios rapides -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-xs shadow-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-xs font-bold uppercase text-slate-300">Tester les scénarios</h3>
                <button onclick="toggleEditModal()" class="text-slate-500 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Boutons de scénarios rapides -->
            <div class="grid grid-cols-2 gap-1.5 text-[11px]">
                <button onclick="applyScenario(450000, 410000, 600000)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">
                    En cours (75%)
                </button>
                <button onclick="applyScenario(680000, 410000, 600000)" class="px-2 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 rounded border border-emerald-500/30 font-semibold">
                    Dépassement (113%)
                </button>
            </div>

            <div class="space-y-2 text-xs pt-1 border-t border-slate-800">
                <div>
                    <label for="input-ca-n" class="block text-slate-400 mb-0.5">CA Année N (€)</label>
                    <input type="number" id="input-ca-n" value="450000" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-semibold outline-none focus:border-blue-500">
                </div>
                <div>
                    <label for="input-n1-date" class="block text-slate-400 mb-0.5">CA N-1 à date (€)</label>
                    <input type="number" id="input-n1-date" value="410000" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-semibold outline-none focus:border-amber-500">
                </div>
                <div>
                    <label for="input-n1-total" class="block text-slate-400 mb-0.5">CA N-1 Total (€)</label>
                    <input type="number" id="input-n1-total" value="600000" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-white font-semibold outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="pt-1 flex justify-end gap-2">
                <button onclick="toggleEditModal()" class="px-3 py-1.5 text-xs text-slate-400 hover:text-white">Annuler</button>
                <button onclick="saveValues()" class="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-500 font-semibold text-white rounded-lg">Appliquer</button>
            </div>
        </div>
    </div>

    <script>
        function formatEUR(val) {
            return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(val) + ' €';
        }

        function toggleEditModal() {
            document.getElementById('edit-modal').classList.toggle('hidden');
        }

        function applyScenario(caN, n1Date, n1Total) {
            document.getElementById('input-ca-n').value = caN;
            document.getElementById('input-n1-date').value = n1Date;
            document.getElementById('input-n1-total').value = n1Total;
            saveValues();
        }

        function saveValues() {
            const caN = parseFloat(document.getElementById('input-ca-n').value) || 0;
            const n1Date = parseFloat(document.getElementById('input-n1-date').value) || 0;
            const n1Total = parseFloat(document.getElementById('input-n1-total').value) || 1;

            // 1. Calculs fondamentaux
            const deltaAbs = caN - n1Date;
            const pctVarDate = n1Date > 0 ? ((caN - n1Date) / n1Date) * 100 : 0;
            const pctTotal = (caN / n1Total) * 100;

            // 2. Échelle dynamique (Si CA N > N-1 Total, l'échelle s'élargit)
            const maxScale = Math.max(caN, n1Total);

            // Positions relatives (%)
            const n1DatePos = Math.min((n1Date / maxScale) * 100, 100);
            const n1TotalPos = (n1Total / maxScale) * 100;
            const caNPos = (caN / maxScale) * 100;

            // 3. Mises à jour des libellés
            document.getElementById('display-ca-n').innerText = formatEUR(caN);
            document.getElementById('display-n1-date').innerText = formatEUR(n1Date);
            document.getElementById('display-n1-total').innerText = formatEUR(n1Total);
            
            document.getElementById('marker-date-label').innerText = 'N-1 date: ' + (n1Date / 1000).toFixed(0) + 'k€';
            document.getElementById('marker-total-label').innerText = '100% (' + (n1Total / 1000).toFixed(0) + 'k€)';
            document.getElementById('display-delta-abs').innerText = (deltaAbs >= 0 ? '+' : '') + formatEUR(deltaAbs) + ' vs N-1 date';

            // Badge d'avancement
            const pctBadge = document.getElementById('display-pct-badge');
            pctBadge.innerText = pctTotal.toFixed(0) + '%';

            // 4. Gestion du Badge de variation (+/- %)
            const badge = document.getElementById('badge-variation');
            const badgeIcon = document.getElementById('badge-icon');
            const badgeText = document.getElementById('badge-text');
            const deltaAbsElem = document.getElementById('display-delta-abs');

            badgeText.innerText = (pctVarDate >= 0 ? '+' : '') + pctVarDate.toFixed(1) + '%';

            if (pctVarDate >= 0) {
                badge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
                badgeIcon.setAttribute('data-lucide', 'trending-up');
                deltaAbsElem.className = "text-xs font-semibold text-emerald-400";
            } else {
                badge.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30";
                badgeIcon.setAttribute('data-lucide', 'trending-down');
                deltaAbsElem.className = "text-xs font-semibold text-rose-400";
            }

            // 5. Mise à jour dynamique de la barre & repères
            const markerDate = document.getElementById('marker-n1-date');
            const markerTotal = document.getElementById('marker-n1-total');
            const barBase = document.getElementById('bar-fill-base');
            const barOverflow = document.getElementById('bar-fill-overflow');

            markerDate.style.left = n1DatePos + '%';

            if (caN > n1Total) {
                // CAS 1 : DÉPASSEMENT (> 100%)
                markerTotal.classList.remove('hidden');
                markerTotal.style.left = n1TotalPos + '%';

                barBase.style.width = n1TotalPos + '%';
                barBase.className = "h-full bg-blue-500 rounded-l-full progress-bar-transition float-left";

                barOverflow.classList.remove('hidden');
                barOverflow.style.width = (caNPos - n1TotalPos) + '%';

                pctBadge.className = "text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            } else {
                // CAS 2 : EN COURS (<= 100%)
                markerTotal.classList.add('hidden');

                barBase.style.width = caNPos + '%';
                barBase.className = "h-full bg-blue-500 rounded-full progress-bar-transition float-left";

                barOverflow.classList.add('hidden');
                barOverflow.style.width = '0%';

                pctBadge.className = "text-[10px] font-bold px-1.5 py-0.2 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30";
            }

            lucide.createIcons();
            if (!document.getElementById('edit-modal').classList.contains('hidden')) {
                toggleEditModal();
            }
        }

        window.onload = function() {
            lucide.createIcons();
            saveValues();
        };
    </script>
</body>
</html>
